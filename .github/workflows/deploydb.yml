name: deploydb
on:
  workflow_dispatch:

jobs:
  load-data:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secrets requeridos
        env:
          S_MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          faltan=""
          for v in ${!S_@}; do if [ -z "${!v}" ]; then faltan="$faltan ${v#S_}"; fi; done
          if [ -n "$faltan" ]; then
            echo "::error title=Faltan secrets de despliegue::Configure en Settings > Secrets and variables > Actions:$faltan. Se obtienen al crear la suscripcion de Azure (ver PENDIENTES)."
            exit 1
          fi
          echo "Secrets configurados"
      - uses: actions/checkout@v4
      - name: Cargar datos en MongoDB Atlas
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          docker run --rm -v "$PWD/data:/data" mongo:7 mongosh "$MONGO_URI" --quiet /data/seed.js
